name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WAILS_VERSION: v3.1.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - run: go test ./...

  # Windows is cross-compiled from Linux (no CGO needed) and packaged with NSIS.
  windows:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-Windows
          path: |
            bin/catjump.exe
            bin/catjump-amd64-installer.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 task darwin:package:universal
      - run: cd bin && ditto -c -k --keepParent catjump.app CatJump-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-macOS
          path: bin/CatJump-macOS.zip

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-Linux
          path: bin/catjump
