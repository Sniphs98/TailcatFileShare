name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release: the version counts up from the last tag (patch 0.2.3 → 0.2.4, minor → 0.3.0, major → 1.0.0)"
        type: choice
        options: [patch, minor, major, none]
        default: patch

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.1.0

jobs:
  version:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      number: ${{ steps.v.outputs.number }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
      - id: v
        run: .github/scripts/version.sh
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'none' }}
          FIRST: v0.2.0

  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install system packages
        timeout-minutes: 15
        run: |
          # A stuck Ubuntu mirror can hang apt for hours; give up after a few
          # minutes and try again instead.
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-4-dev libwebkitgtk-6.0-dev && exit 0
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          exit 1
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - run: go test ./...

  # Windows is cross-compiled from Linux (no CGO needed) and packaged with NSIS.
  windows:
    timeout-minutes: 30
    needs: [test, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wails3 CLI itself links against GTK on Linux.
      - name: Install system packages
        timeout-minutes: 15
        run: |
          # A stuck Ubuntu mirror can hang apt for hours; give up after a few
          # minutes and try again instead.
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y nsis libgtk-4-dev libwebkitgtk-6.0-dev && exit 0
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          exit 1
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-Windows
          path: |
            bin/catjump.exe
            bin/catjump-amd64-installer.exe

  macos:
    timeout-minutes: 30
    needs: [test, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 task darwin:package:universal
      - run: cd bin && ditto -c -k --keepParent catjump.app CatJump-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-macOS
          path: bin/CatJump-macOS.zip

  linux:
    timeout-minutes: 30
    needs: [test, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system packages
        timeout-minutes: 15
        run: |
          # A stuck Ubuntu mirror can hang apt for hours; give up after a few
          # minutes and try again instead.
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-4-dev libwebkitgtk-6.0-dev && exit 0
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          exit 1
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: catjump-Linux
          path: bin/catjump

  # Collect everything into a GitHub release.
  release:
    timeout-minutes: 30
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: catjump-*
      - name: Collect release files
        run: |
          mkdir dist
          a=artifacts
          cp "$a/catjump-Windows/catjump-amd64-installer.exe" dist/CatJump-Setup-windows-x64.exe
          cp "$a/catjump-Windows/catjump.exe"                 dist/CatJump-portable-windows-x64.exe
          cp "$a/catjump-macOS/CatJump-macOS.zip"             dist/CatJump-macOS.zip
          cp "$a/catjump-Linux/catjump"                       dist/CatJump-linux-x64
          chmod +x dist/CatJump-linux-x64
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          - Windows: \`CatJump-Setup-windows-x64.exe\` (installer, recommended) or \`CatJump-portable-windows-x64.exe\`
          - macOS: \`CatJump-macOS.zip\` (Intel and Apple Silicon)
          - Linux: \`CatJump-linux-x64\` (needs GTK 4 and WebKitGTK 6.0)

          The apps aren't code-signed. Windows: *More info → Run anyway*. macOS: right-click the app → *Open*
          (on macOS 15 and later: *System Settings → Privacy & Security → Open Anyway*).
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Release already published on GitHub for a pushed tag: attach the files.
            gh release upload "$VERSION" dist/* --clobber
          else
            # Also creates the tag on this commit.
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "CatJump $VERSION" --notes-file notes.md --generate-notes
          fi

