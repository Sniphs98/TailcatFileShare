name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - run: go test -tags webkit2_41 ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            flags: -nsis
          - os: macos-latest
            platform: darwin/universal
            flags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            flags: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: wails build -platform ${{ matrix.platform }} ${{ matrix.flags }}
        shell: bash
      - if: runner.os == 'macOS'
        run: cd build/bin && for a in *.app; do ditto -c -k --keepParent "$a" Katzensprung-macOS.zip && rm -rf "$a"; done
      - uses: actions/upload-artifact@v4
        with:
          name: katzensprung-${{ runner.os }}
          path: build/bin/*
